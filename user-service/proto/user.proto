syntax = "proto3";

package user;

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
  rpc GetUsers (GetUsersRequest) returns (UsersResponse);
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc DeleteUser (UserRequest) returns (DeleteResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
 
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message UserRequest {
  string id = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
}


message GetUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  //page_token permet de savoir où reprendre la récupération des données lorsqu'on passe à la page suivante.
}

message UserResponse {
  User user = 1;
}

message UsersResponse {
  repeated User users = 1;
}

message DeleteResponse {
  bool success = 1;
}
message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
}
message Empty {}