syntax = "proto3";

package book;

service BookService {
  // Catalogue
  rpc GetBook (BookRequest) returns (BookResponse);
  rpc GetBooks (Empty) returns (BooksResponse);
  rpc CreateBook (CreateBookRequest) returns (BookResponse);
  rpc UpdateBook (UpdateBookRequest) returns (BookResponse);
  rpc DeleteBook (BookRequest) returns (DeleteResponse);

  // Gestion de la disponibilité
  rpc CheckAvailability (BookRequest) returns (AvailabilityResponse);
  rpc BorrowBook (BookRequest) returns (BookOperationResponse);
  rpc ReturnBook (BookRequest) returns (BookOperationResponse);
}

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  string status = 4; // AVAILABLE / BORROWED / UNAVAILABLE
}
message BookOperationResponse {
    bool success = 1;
    string message = 2;
    Book book = 3;
}

message BookRequest {
  string id = 1;
}

message CreateBookRequest {
  string title = 1;
  string author = 2;
}

message UpdateBookRequest {
  string id = 1;
  string title = 2;
  string author = 3;
}

message AvailabilityResponse {
  bool exists = 1;
  bool available = 2;
  string status = 3;
}

message BooksResponse {
  repeated Book books = 1;
}

message BookResponse {
  Book book = 1;
}

message DeleteResponse {
  bool success = 1;
}

message Empty {}